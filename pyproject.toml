[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sigmoid"
version = "0.1.0"
description = "A world-model inference engine built from topological coupling operators"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/teerthsharma/sigmoid"
Documentation = "https://teerthsharma.github.io/sigmoid/"
Changelog = "https://github.com/teerthsharma/sigmoid/blob/main/CHANGELOG.md"
Issues = "https://github.com/teerthsharma/sigmoid/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "scikit-learn>=1.3", "ripser>=0.6"]
h1 = ["ripser>=0.6"]
torch = ["torch>=2.0", "transformers>=4.40"]

[project.scripts]
sigmoid = "sigmoid.cli:main"

[tool.setuptools.packages.find]
include = ["sigmoid*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E741 - `l` reads fine for a lattice/left index in this maths
# B008 - dataclass field(default_factory=...) is the intended pattern
# B905 - every zip() here pairs sequences constructed together in the same
#        scope; strict= would be ceremony across 9 call sites
ignore = ["E741", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
# examples print wide measured tables; sys.path shim precedes imports
"examples/*" = ["E402", "E501"]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
