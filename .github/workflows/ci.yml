name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test suite
        run: pytest -q
      - name: Standalone harnesses
        shell: bash
        run: |
          for t in tests/test_*.py; do
            echo "--- $t"
            python "$t"
          done
      - name: Schedule self-check
        run: python -m sigmoid.schedule

  minimal-deps:
    name: core deps only (numpy + scipy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install without extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Import and run without torch, ripser or sklearn
        run: |
          python -c "import sigmoid; print(sigmoid.__version__, len(sigmoid.__all__))"
          python -m sigmoid.schedule
